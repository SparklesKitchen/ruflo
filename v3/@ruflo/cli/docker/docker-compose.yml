# Ruflo v3.5 — Docker Compose Profiles
#
# Profiles:
#   lite     — MCP server only (stdio), minimal footprint
#   full     — CLI + daemon + all optional deps
#   workers  — Scalable worker pool (extends docker-compose.workers.yml)
#
# Usage:
#   docker compose -f v3/@ruflo/cli/docker/docker-compose.yml --profile lite up
#   docker compose -f v3/@ruflo/cli/docker/docker-compose.yml --profile full up -d
#   docker compose -f v3/@ruflo/cli/docker/docker-compose.yml --profile workers up -d --scale worker=5
#
# Environment (required for full/workers):
#   OPENAI_API_KEY — Your OpenAI API key

services:
  # ── lite: MCP server on stdio (~80MB) ──────────────────────────
  mcp:
    profiles: ["lite"]
    build:
      context: ../../../..
      dockerfile: v3/@ruflo/cli/docker/Dockerfile
    image: ruflo:lite
    stdin_open: true
    environment:
      - NODE_ENV=production
      - RUFLO_MCP_TRANSPORT=stdio
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "ruflo", "doctor", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── full: CLI + daemon + optional deps (~800MB) ────────────────
  ruflo-full:
    profiles: ["full"]
    build:
      context: ../../../..
      dockerfile: v3/@ruflo/cli/docker/Dockerfile.full
    image: ruflo:full
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NODE_ENV=production
      - RUFLO_LOG_LEVEL=${RUFLO_LOG_LEVEL:-info}
      - RUFLO_MEMORY_BACKEND=hybrid
    volumes:
      - ruflo-state:/home/ruflo/.codex
      - ruflo-logs:/var/log/ruflo
    ports:
      - "${RUFLO_MCP_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "1"
          memory: 2G
    command: ["ruflo", "daemon", "start", "--foreground"]
    healthcheck:
      test: ["CMD", "ruflo", "doctor", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── workers: Scalable worker pool ──────────────────────────────
  worker:
    profiles: ["workers"]
    build:
      context: ../../../..
      dockerfile: v3/@ruflo/cli/docker/Dockerfile
    image: ruflo:lite
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CODEX_HEADLESS=true
      - CODEX_SANDBOX_MODE=${RUFLO_SANDBOX:-strict}
      - RUFLO_WORKERS=${RUFLO_WORKERS:-audit,optimize,testgaps}
      - NODE_ENV=production
    volumes:
      - worker-state:/home/ruflo/.codex
      - worker-logs:/var/log/ruflo
    deploy:
      replicas: ${RUFLO_WORKER_REPLICAS:-3}
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    command: ["ruflo", "daemon", "start", "--foreground", "--headless"]
    healthcheck:
      test: ["CMD", "ruflo", "doctor", "--quiet"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ruflo-state:
  ruflo-logs:
  worker-state:
  worker-logs:
